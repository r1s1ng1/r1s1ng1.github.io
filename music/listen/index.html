<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listen - r1s1ng1 Music</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>

    <h1>LISTEN</h1>


        <p>
            Coming - Soon
        </p>

        <audio id="player">
            <source src="audio/Biwa .mp3" type="audio/mpeg">
        </audio>

        <div class="player-controls">
    <button onclick="rewind()"><<</button>
    <button id="playButton" onclick="togglePlay()">></button>
    <button onclick="forward()">>></button>
    </div>

        <p id="time">
            0:00 ────────── 0:00
        </p>

        <br>
                
    <nav>

        <a href="#">YouTube</a>
        <a href="#">SoundCloud</a>

    </nav>


    <script>

        const audio = document.getElementById("player");
        const timeDisplay = document.getElementById("time");
        const playButton = document.getElementById("playButton");


        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }


        function rewind() {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        }


        function forward() {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) {
                return "0:00";
            }

            let minutes = Math.floor(seconds / 60);
            let remainingSeconds = Math.floor(seconds % 60);

            if (remainingSeconds < 10) {
                remainingSeconds = "0" + remainingSeconds;
            }

            return minutes + ":" + remainingSeconds;
        }


        function updateProgress() {

            let current = audio.currentTime;
            let duration = audio.duration;

            let progress = 0;

            if (!isNaN(duration)) {
                progress = current / duration;
            }

            let totalBars = 10;
            let filledBars = Math.floor(progress * totalBars);

            let bar =
                "━".repeat(filledBars) +
                "─".repeat(totalBars - filledBars);


            timeDisplay.textContent =
                formatTime(current) +
                " " +
                bar +
                " " +
                formatTime(duration);
        }

        audio.addEventListener("play", function() {
    playButton.textContent = "<";
});

audio.addEventListener("pause", function() {
    playButton.textContent = ">";
});

        audio.addEventListener("timeupdate", updateProgress);
        audio.addEventListener("loadedmetadata", updateProgress);


    </script>

</body>
</html>
